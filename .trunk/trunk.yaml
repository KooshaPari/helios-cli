# =============================================================================
# Trunk.io — Lint/format configuration (schema v0.1)
# =============================================================================
# Migrated 2026-08-09 from the legacy top-level linters/formatters/actions/
# cache/env schema to version: 0.1 + lint/fmt blocks. Tool versions are
# trunk-io/plugins known-good versions; update with `trunk upgrade`.
# https://docs.trunk.io/
# =============================================================================

version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.6.1
      uri: https://github.com/trunk-io/plugins

# Linters (auto-detected by file type)
lint:
  enabled:
    - actionlint@1.7.8
    - black@25.9.0
    - clippy@1.65.0
    - eslint@8.10.0
    - golangci-lint@1.64.8
    - mypy@1.20.2
    - ruff@0.14.3
    - shellcheck@0.11.0
    - taplo@0.10.0
    - yamllint@1.37.1
  definitions:
    - name: actionlint
      commands:
        - name: lint
          run: actionlint ${target}
    - name: black
      commands:
        - name: lint
          run: black --check --line-length 100 ${target}
    - name: clippy
      commands:
        - name: lint
          run: cargo clippy --all-targets --all-features -- -D warnings
    - name: mypy
      commands:
        - name: lint
          run: mypy --ignore-missing-imports ${target}
    - name: ruff
      commands:
        - name: lint
          run: ruff check --output-format=github ${target}

# Formatters
fmt:
  enabled:
    - black@25.9.0
    - prettier@3.6.2
    - rustfmt@1.65.0
  definitions:
    - name: black
      commands:
        - name: format
          run: black --line-length 100 ${target}
    - name: rustfmt
      commands:
        - name: format
          run: rustfmt ${target}
