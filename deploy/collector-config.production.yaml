# Helios CLI — Production OTel Collector Configuration
# Pinned to otel/opentelemetry-collector-contrib v0.108.0
# Docs: https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 8388608  # 8 MiB

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 16000
    send_batch_max_size: 32000
    timeout: 5s

  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: cli.type
        value: helios-cli
        action: upsert
      - key: service.version
        value: "${OTEL_SERVICE_VERSION}"
        action: upsert

  # Tail-based sampling: drop low-value traces, keep all errors
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    policies:
      # Always keep traces with errors
      - name: errors-policy
        type: status_code
        status_code:
          status_codes:
            - ERROR
      # Sample 10% of successful traces
      - name: successful-sampling
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s]
    dimensions:
      - name: service.name
      - name: cli.command
      - name: cli.exit_code
    metrics_flush_interval: 15s

exporters:
  otlp/jaeger:
    endpoint: ${JAEGER_OTLP_ENDPOINT}
    tls:
      insecure: false
      cert_file: /etc/otelcol/certs/ca.crt
      key_file: /etc/otelcol/certs/ca.key
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000

  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: helios_cli
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  logging:
    loglevel: warn
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, zpages, pprof]
  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, tail_sampling, batch]
      exporters: [otlp/jaeger]
    traces/spanmetrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [logging]
