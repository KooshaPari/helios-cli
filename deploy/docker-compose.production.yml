# Helios CLI — Production Docker Compose for OTel Collector Stack
# Usage:
#   cp .env.production .env   # then edit .env
#   docker compose -f docker-compose.production.yml --env-file .env up -d
#   docker compose -f docker-compose.production.yml --env-file .env down

services:
  collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.108.0}
    container_name: helios-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector-config.production.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter metrics
      - "8888:8888"   # Collector internal telemetry
      - "13133:13133" # Health check
    environment:
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.2.1}
      - JAEGER_OTLP_ENDPOINT=${JAEGER_OTLP_ENDPOINT:-jaeger:4317}
    deploy:
      resources:
        limits:
          cpus: ${COLLECTOR_CPU_LIMIT:-2.0}
          memory: ${COLLECTOR_MEM_LIMIT:-1g}
        reservations:
          cpus: ${COLLECTOR_CPU_RESERVATION:-0.5}
          memory: ${COLLECTOR_MEM_RESERVATION:-512m}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - helios-otel

  jaeger:
    image: jaegertracing/all-in-one:${JAEGER_VERSION:-1.61}
    container_name: helios-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_GRPC_HOST_PORT=:4317
      - COLLECTOR_OTLP_HTTP_HOST_PORT=:4318
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
      - BADGER_SPAN_STORE_TTL=168h
      - BADGER_SPAN_STORE_CLOSE_INTERVAL=5m
      - QUERY_BASE_PATH=/
    volumes:
      - jaeger-data:/badger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC native
      - "14268:14268"  # HTTP collector
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
        reservations:
          cpus: "0.25"
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - helios-otel

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.54.1}
    container_name: helios-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_STORAGE_RETENTION_SIZE:-10GB}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
    volumes:
      - ./prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
        reservations:
          cpus: "0.25"
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - helios-otel

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.2.2}
    container_name: helios-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-CHANGE_ME}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ../otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../otel/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - helios-otel

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local

networks:
  helios-otel:
    name: ${HELIOS_OTEL_NETWORK:-helios-otel}
    driver: bridge
    ipam:
      config:
        - subnet: ${HELIOS_OTEL_SUBNET:-172.28.0.0/16}
