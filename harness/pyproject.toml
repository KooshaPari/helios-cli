[project]
name = "helios-harness"
version = "0.1.0"
description = "Reusable CLI/API/SDK quality harness for phase-2 evidence generation"
requires-python = ">=3.12"
dependencies = [
    "fastjsonschema>=2.21,<3",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "psutil>=6,<8",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
helios-harness = "harness.scripts.run_harness:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/run-harness.py" = "harness/_legacy_runner.py"
"schemas/benchmark_run.schema.json" = "harness/schemas/benchmark_run.schema.json"

# M1/Apple Silicon build settings
[tool.hatch.envs.default]
features = ["simd"]

[tool.hatch.envs.default.overrides]
matrix = { python = "3.12-aarch64" }

# Universal Binary support
[tool.hatch.metadata]
allow-multiple-wheels = true
