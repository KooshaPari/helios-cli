# docker-compose.dev.yml — Helios CLI development environment
# Mounts source for hot-reload, caches Rust/Go/Node artifacts.
# Usage: docker compose -f docker-compose.dev.yml up --build
#        docker compose -f docker-compose.dev.yml exec dev bash

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: helios-cli-dev
    working_dir: /workspace
    volumes:
      # ── Source mounts (hot-reload) ────────────────────────
      - .:/workspace
      # ── Rust build cache ──────────────────────────────────
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
      # ── Go module + build cache ───────────────────────────
      - go-pkg:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      # ── Python cache ──────────────────────────────────────
      - pip-cache:/root/.cache/pip
      # ── Node modules ──────────────────────────────────────
      - node-modules:/workspace/node_modules
    environment:
      - CARGO_INCREMENTAL=1
      - CARGO_NET_GIT_FETCH_WITH_CLI=true
      - RUST_BACKTRACE=1
      - GOCACHE=/root/.cache/go-build
      - GOMODCACHE=/root/go/pkg/mod
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"   # API server
      - "9090:9090"   # Debug (Delve)
      - "3000:3000"   # Dev server
    # Keep container alive for interactive use
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "cargo", "check", "--workspace"]
      interval: 120s
      timeout: 60s
      retries: 2
      start_period: 30s

volumes:
  cargo-registry:
    driver: local
  cargo-git:
    driver: local
  cargo-target:
    driver: local
  go-pkg:
    driver: local
  go-build-cache:
    driver: local
  pip-cache:
    driver: local
  node-modules:
    driver: local
