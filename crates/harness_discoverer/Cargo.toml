[package]
name = "harness_discoverer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HeliosCLI"
description = "harness discoverer — Phenotype infrastructure crate (HeliosCLI)"
documentation = "https://docs.rs/harness_discoverer"
keywords = ["phenotype", "helios", "harness"]
categories = ["development-tools::testing"]
authors = ["kooshapari"]

[dependencies]
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[lib]
path = "src/lib.rs"
