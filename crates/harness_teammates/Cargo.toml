[package]
name = "harness_teammates"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HeliosCLI"
description = "harness teammates — Phenotype infrastructure crate (HeliosCLI)"
documentation = "https://docs.rs/harness_teammates"
keywords = ["phenotype", "helios", "harness"]
categories = ["development-tools::testing"]
authors = ["kooshapari"]

[dependencies]
tokio = { version = "1", features = ["sync", "rt"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
path = "src/lib.rs"
