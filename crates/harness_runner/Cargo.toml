[package]
name = "harness_runner"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HeliosCLI"
description = "harness runner — Phenotype infrastructure crate (HeliosCLI)"
documentation = "https://docs.rs/harness_runner"
keywords = ["phenotype", "helios", "harness"]
categories = ["development-tools::testing"]
authors = ["kooshapari"]

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"

[lib]
path = "src/lib.rs"

# M1/Apple Silicon optimizations
[target.'cfg(target_arch = "aarch64")'.dependencies]
rayon = "1.8"  # SIMD parallelization
