[package]
name = "harness_pyo3"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HeliosCLI"
description = "harness pyo3 — Phenotype infrastructure crate (HeliosCLI)"
documentation = "https://docs.rs/harness_pyo3"
keywords = ["phenotype", "helios", "harness"]
categories = ["development-tools::testing"]
authors = ["kooshapari"]

[lib]
name = "harness_pyo3"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "auto-initialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
# Use the canonical phenoShared origin instead of weak relative checkout lookups.
ffi_utils = { git = "https://github.com/KooshaPari/phenotype-shared", path = "crates/ffi_utils" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
