# AgilePlus Quality Gates
#
# Consumed by:
#   * .github/workflows/*  (gate wiring)
#   * harness/scripts/gates.py (local CLI: `harness gate run <name>`)
#   * agileplus-pillar-scorecard.yml (weekly aggregate)
#
# Schema is intentionally simple so a single grep / yaml.load reads it.

version: 1
repo: helios-cli
strict_mode: true
fail_open: false

# Gates run in order. A gate is "blocking" when `required_to_merge: true`.
gates:

  - name: lint
    description: Static analysis + formatters across all surfaces.
    required_to_merge: true
    tools:
      - name: rustfmt
        cmd: cargo fmt --all -- --check
        languages: [rust]
      - name: clippy
        cmd: cargo clippy --workspace --all-targets -- -D warnings
        languages: [rust]
      - name: actionlint
        cmd: actionlint -color
        paths: [".github/workflows/"]
      - name: yamllint
        cmd: yamllint -c .yamllint.yaml .
      - name: codespell
        cmd: codespell --ignore-words .codespell-ignore.txt agileplus docs sdk harness
      - name: prettier
        cmd: prettier --check "**/*.{md,json,yml,yaml}"
        paths: ["agileplus/", "docs/", ".github/"]
    on_failure: comment

  - name: test
    description: Unit + integration tests across rust + sdk.
    required_to_merge: true
    tools:
      - name: cargo-test
        cmd: cargo test --workspace --all-features --locked
        languages: [rust]
      - name: sdk-pytest
        cmd: pytest -q sdk/python
        languages: [python]
      - name: sdk-jest
        cmd: pnpm --filter @helios/sdk test
        paths: ["sdk/typescript/"]

  - name: coverage
    description: Patch coverage gate.
    required_to_merge: true
    threshold:
      warn_below: 70
      fail_below: 60
    tools:
      - name: cargo-llvm-cov
        cmd: cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info
      - name: diff-cover
        cmd: diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=70

  - name: security
    description: Supply chain + static analysis for vulnerabilities.
    required_to_merge: true
    tools:
      - name: cargo-deny
        cmd: cargo deny --workspace check advisories bans licenses sources
      - name: sonar-security-rating
        cmd: sonar-scanner -Dsonar.qualitygate.wait=true
        min_rating: A
      - name: zizmor
        cmd: zizmor --format github .
        paths: [".github/workflows/"]

  - name: license
    description: REUSE + cargo-deny license compliance.
    required_to_merge: true
    tools:
      - name: reuse
        cmd: reuse lint
      - name: cargo-deny-licenses
        cmd: cargo deny check licenses

  - name: docs
    description: Doc build + link integrity.
    required_to_merge: true
    tools:
      - name: vitepress-build
        cmd: pnpm --filter docs build
      - name: broken-link-check
        cmd: pnpm --filter docs check:links

  - name: i18n
    description: Parity check across doc locales.
    required_to_merge: false
    blocking_threshold: 6
    tools:
      - name: linguijin-extract
        cmd: linguijin extract --check
        paths: ["docs/"]

# Tag-aware overrides: tag-driven releases apply stricter thresholds.
release_overrides:
  v*:
    coverage:
      fail_below: 70
    security:
      min_rating: A

# Aggregation used by the weekly pillar-scorecard issue.
aggregation:
  pillar_inputs:
    branch_mgmt:  branch_protection.required_reviews + branch_protection.linear_history
    ci_cd:        gates.lint.passed + gates.test.passed
    security:     gates.security.passed
    docs:         gates.docs.passed
    tests:        gates.coverage.percent