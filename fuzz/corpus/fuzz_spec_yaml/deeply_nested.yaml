spec:
  name: deeply-nested-test
  version: "1.0.0"
  owner: test-team
  verification:
    - type: test
      name: unit_tests
      command: cargo test
      timeout: 300
      env:
        RUST_LOG: debug
        CARGO_INCREMENTAL: "0"
        RUSTFLAGS: "-D warnings"
        TARGET_DIR: target/fuzz
        PROFILE: release
        FEATURES: "full"
        EXCLUDE: "slow_tests"
      retries: 3
      artifacts:
        - path: target/criterion
          type: directory
          retention_days: 7
        - path: target/coverage
          type: directory
          retention_days: 14
          compress: true
    - type: integration
      name: integration_tests
      command: cargo test --test '*'
      timeout: 600
      depends_on:
        - unit_tests
      services:
        - name: postgres
          image: postgres:15
          ports:
            - "5432:5432"
          env:
            POSTGRES_DB: test_db
            POSTGRES_USER: test_user
            POSTGRES_PASSWORD: test_pass
        - name: redis
          image: redis:7
          ports:
            - "6379:6379"
          health_check:
            command: redis-cli ping
            interval: 5
            timeout: 3
            retries: 10
      artifacts:
        - path: logs/integration
          type: directory
          retention_days: 30
  rollback:
    strategy: git_revert
    checkpoint_required: true
    auto_rollback: true
    max_rollback_depth: 5
    notification:
      slack: "#alerts"
      email: "team@example.com"
      on_success: true
      on_failure: true
  metadata:
    labels:
      - ci
      - nightly
      - integration
    annotations:
      coverage_threshold: 80
      performance_budget_ms: 5000
      memory_limit_mb: 512
