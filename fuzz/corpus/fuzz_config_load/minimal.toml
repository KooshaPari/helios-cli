[cache]
max_capacity = 5000
ttl_secs = 600

[runner]
timeout_secs = 120

[scaling]
min_instances = 1
max_instances = 10
target_cpu_percent = 50.0
target_memory_percent = 70.0
cooldown_secs = 60

[circuit_breaker]
failure_threshold = 5
success_threshold = 3
retry_timeout_secs = 30

[teammate]
max_concurrent = 4
timeout_secs = 300

[spec]
default_version = "1.0.0"
default_timeout_secs = 30

[checkpoint]
git_signature_name = "heliosHarness"
git_signature_email = "checkpoint@helios.local"

[elicitation]
confidence_threshold = 0.8

[verify]
test_timeout_secs = 300
smoke_test_timeout_secs = 60

[predictive_scaler]
max_history = 100
prediction_horizon = 5

[token_bucket]
default_capacity = 100.0
default_refill_rate = 10.0
