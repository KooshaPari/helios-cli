[package]
name = "helios-fuzz"
version = "0.0.0"
authors = ["kooshapari"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Depend on the workspace crates we want to fuzz.
# Use path deps to the same workspace members.
harness_spec = { path = "../crates/harness_spec" }
harness_utils = { path = "../crates/harness_utils" }
harness_normalizer = { path = "../crates/harness_normalizer" }
helios_config = { path = "../crates/helios_config" }

# Required by harness_spec's parser and helios_config
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.33", features = ["serde"] }
regex = "1.10"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
toml = "0.8"

[[bin]]
name = "fuzz_parse_input"
path = "fuzz_targets/fuzz_parse_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_spec_yaml"
path = "fuzz_targets/fuzz_spec_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_spec_json"
path = "fuzz_targets/fuzz_spec_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_normalizer_json"
path = "fuzz_targets/fuzz_normalizer_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_config_load"
path = "fuzz_targets/fuzz_config_load.rs"
test = false
doc = false
bench = false
