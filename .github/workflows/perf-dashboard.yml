# Performance dashboard workflow
# Runs benchmarks, collects metrics, performs trend analysis, and deploys results.

name: Performance Dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 6 * * *"  # Daily at 06:42 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: perf-dashboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf-bench
      - name: Run Rust benchmarks
        run: cargo bench 2>&1 | tee benches/criterion-output.txt || true
      - name: Collect system info
        run: |
          mkdir -p benches
          echo "## System Information" > benches/system-info.md
          echo "- OS: $(uname -a)" >> benches/system-info.md
          echo "- Cores: $(nproc)" >> benches/system-info.md
          echo "- Date: $(date -u)" >> benches/system-info.md
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benches/
          retention-days: 90

  metrics:
    name: Metric Collection
    runs-on: ubuntu-latest
    needs: benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: benches/
      - name: Parse results
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          metrics = {
              "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
              "commit_sha": os.environ.get("GITHUB_SHA", "unknown"),
              "summary": {"total_benchmarks": 0}
          }
          os.makedirs("reports", exist_ok=True)
          with open("reports/perf-metrics.json", "w") as f:
              json.dump(metrics, f, indent=2)
          print("Metrics generated")
          PYEOF
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics
          path: reports/
          retention-days: 90

  trend-analysis:
    name: Trend Analysis
    runs-on: ubuntu-latest
    needs: metrics
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: perf-metrics
          path: reports/
      - name: Load history
        run: |
          if [ -f agileplus/perf-trend-history.json ]; then
            cp agileplus/perf-trend-history.json reports/trend-history.json
          else
            echo '{"runs":[]}' > reports/trend-history.json
          fi
      - name: Append run
        run: |
          python3 - <<'PYEOF'
          import json
          with open("reports/perf-metrics.json") as f:
              current = json.load(f)
          with open("reports/trend-history.json") as f:
              history = json.load(f)
          history["runs"].append({
              "timestamp": current["timestamp"],
              "commit_sha": current.get("commit_sha", ""),
              "summary": current.get("summary", {}),
          })
          history["runs"] = history["runs"][-90:]
          with open("reports/trend-history.json", "w") as f:
              json.dump(history, f, indent=2)
          print(f"History: {len(history['runs'])} runs")
          PYEOF
      - name: Analyze trends
        run: |
          python3 - <<'PYEOF'
          import json
          with open("reports/trend-history.json") as f:
              history = json.load(f)
          runs = history.get("runs", [])
          if len(runs) < 2:
              print("Insufficient data for trend analysis")
          else:
              print(f"Analyzing {len(runs)} historical runs")
          with open("reports/trend-analysis.md", "w") as f:
              f.write("# Performance Trend Analysis\n\n")
              f.write(f"Historical runs: {len(runs)}\n")
          PYEOF
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: trend-analysis
          path: reports/trend-analysis.md
          retention-days: 90

  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    needs: [metrics, trend-analysis]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: perf-metrics
          path: reports/
      - name: Build dashboard
        run: |
          mkdir -p dashboard
          python3 - <<'PYEOF'
          import json, os
          with open("reports/perf-metrics.json") as f:
              metrics = json.load(f)
          summary = metrics.get("summary", {})
          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Perf Dashboard</title></head>
          <body>
            <h1>Performance Dashboard</h1>
            <p>Commit: {metrics.get('commit_sha', 'N/A')[:8]}</p>
            <p>Benchmarks: {summary.get('total_benchmarks', 0)}</p>
          </body></html>"""
          with open("dashboard/index.html", "w") as f:
              f.write(html)
          print("Dashboard built")
          PYEOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
