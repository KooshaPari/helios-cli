name: Alert sync issues
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
  timeout-minutes: 10
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    uses: KooshaPari/phenoShared/.github/workflows/reusable/alert-sync-issues.yml@6a6e1b06026e9443449e419a2892cd0e47c19442
    with:
      auto-label: auto-alert-sync
