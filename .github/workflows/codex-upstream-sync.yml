name: Codex Upstream Sync

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if no upstream changes"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    name: Check OpenAI Codex Upstream
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream Codex changes
        id: check
        run: |
          # Fetch latest from openai/codex
          git remote add upstream https://github.com/openai/codex.git 2>/dev/null || true
          git fetch upstream main 2>/dev/null || true

          UPSTREAM_SHA=$(git rev-parse upstream/main 2>/dev/null || echo "unknown")
          CURRENT_SYNC=$(cat .codex-sync-sha 2>/dev/null || echo "none")

          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "current_sync=$CURRENT_SYNC"

          if [ "$UPSTREAM_SHA" = "$CURRENT_SYNC" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes since last sync ($CURRENT_SYNC)"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has changes: $CURRENT_SYNC -> $UPSTREAM_SHA"
          fi

      - name: Generate diff summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          CURRENT_SYNC=$(cat .codex-sync-sha 2>/dev/null || echo "")
          UPSTREAM_SHA=${{ steps.check.outputs.upstream_sha }}

          echo "## Codex Upstream Sync Available" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Last sync | \`$CURRENT_SYNC\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest upstream | \`$UPSTREAM_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show changed files
          if [ -n "$CURRENT_SYNC" ]; then
            echo "### Changed files since last sync" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git diff --stat "$CURRENT_SYNC"..upstream/main -- codex-rs/ 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Action required" >> $GITHUB_STEP_SUMMARY
          echo "Review the upstream changes and merge into \`codex-rs/\` vendored directory." >> $GITHUB_STEP_SUMMARY

      - name: Create issue if changes found
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const upstreamSha = '${{ steps.check.outputs.upstream_sha }}'.substring(0, 8);
            const title = `chore: sync codex-rs from upstream (${upstreamSha})`;
            const body = `## Upstream Codex Changes Detected

            The vendored \`codex-rs/\` directory may be out of sync with [openai/codex](https://github.com/openai/codex).

            **Upstream SHA:** \`${{ steps.check.outputs.upstream_sha }}\`

            ### Steps to sync:
            1. Review upstream changes: \`git diff HEAD..upstream/main -- codex-rs/\`
            2. Update vendored files in \`codex-rs/\`
            3. Run \`cargo check --workspace\` to verify
            4. Update \`.codex-sync-sha\` with new SHA
            5. Commit and push

            ### Risk assessment:
            - Low risk: Documentation, comments, tests
            - Medium risk: API changes, new features
            - High risk: Breaking changes, removals
            `;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
              per_page: 5
            });

            if (issues.data.some(i => i.title.includes('codex-rs'))) {
              console.log('Issue already exists, skipping');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['upstream-sync', 'dependencies']
            });
