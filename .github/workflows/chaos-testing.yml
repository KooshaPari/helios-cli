# Chaos testing workflow
# Runs network, resource, and service-dependency chaos tests on main and weekly.

name: Chaos Testing

on:
  push:
    branches: [main]
    inputs:
      mode:
        description: "Run mode: 'fast' (critical tests only) or 'full' (all suites)"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - fast
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * 0"  # Weekly on Sunday at 03:17 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate job for PR label check - only runs chaos tests when 'chaos' label is present
  chaos-gate-check:
    name: Chaos Gate Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for chaos label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (!labels.includes('chaos')) {
              core.info('No "chaos" label found - skipping chaos tests');
              core.setOutput('skip', 'true');
            } else {
              core.info('"chaos" label found - running chaos tests');
              core.setOutput('skip', 'false');
            }

  network-chaos:
    name: Network Chaos Tests
    needs: [chaos-gate-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ((needs.chaos-gate-check.result == 'skipped' && github.event_name != 'pull_request') ||
       needs.chaos-gate-check.outputs.skip == 'false' ||
       github.event_name == 'schedule') &&
      (github.event_name != 'push' || inputs.mode != 'fast')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos-network
      - name: Run network partition tests
        run: |
          cargo test -p harness_recorder --test chaos -- network_partition --nocapture \
            2>&1 | tee chaos-network-results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-chaos-results
          path: chaos-network-results.txt
          retention-days: 14

  resource-chaos:
    name: Resource Chaos Tests
    needs: [chaos-gate-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ((needs.chaos-gate-check.result == 'skipped' && github.event_name != 'pull_request') ||
       needs.chaos-gate-check.outputs.skip == 'false' ||
       github.event_name == 'schedule') &&
      (github.event_name != 'push' || inputs.mode != 'fast')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos-resource
      - name: Run resource exhaustion tests
        run: |
          cargo test -p harness_recorder --test chaos -- resource_exhaustion --nocapture \
            2>&1 | tee chaos-resource-results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-chaos-results
          path: chaos-resource-results.txt
          retention-days: 14

  dependency-chaos:
    name: Service Dependency Chaos
    needs: [chaos-gate-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (needs.chaos-gate-check.result == 'skipped' && github.event_name != 'pull_request') ||
      needs.chaos-gate-check.outputs.skip == 'false' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chaos-dependency
      - name: Run circuit breaker tests
        run: |
          cargo test -p harness_recorder --test chaos -- circuit_breaker --nocapture \
            2>&1 | tee chaos-dep-results.txt
      - name: Run retry/backoff tests
        run: |
          cargo test -p harness_recorder --test chaos -- backoff --nocapture \
            2>&1 | tee -a chaos-dep-results.txt
      - name: Run timeout tests
        run: |
          cargo test -p harness_recorder --test chaos -- timeout --nocapture \
            2>&1 | tee -a chaos-dep-results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-chaos-results
          path: chaos-dep-results.txt
          retention-days: 14

  report:
    name: Chaos Test Report
    runs-on: ubuntu-latest
    needs: [network-chaos, resource-chaos, dependency-chaos]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: chaos-results/
      - name: Generate summary
        run: |
          echo "# Chaos Test Report" > chaos-report.md
          echo "" >> chaos-report.md
          echo "**Run:** ${{ github.run_number }} | **Commit:** ${{ github.sha }}" >> chaos-report.md
          echo "" >> chaos-report.md
          echo "| Job | Status |" >> chaos-report.md
          echo "|-----|--------|" >> chaos-report.md
          echo "| Network | ${{ needs.network-chaos.result }} |" >> chaos-report.md
          echo "| Resource | ${{ needs.resource-chaos.result }} |" >> chaos-report.md
          echo "| Dependency | ${{ needs.dependency-chaos.result }} |" >> chaos-report.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: chaos-test-report
          path: chaos-report.md
          retention-days: 30
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('chaos-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });
